name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            port: "3000"
            image_suffix: ""
            dockerfile: Dockerfile
          - app: docs
            port: "3001"
            image_suffix: "-docs"
            dockerfile: Dockerfile
          - app: migrate
            port: "0"
            image_suffix: "-migrate"
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            PORT=${{ matrix.port }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lighthouse
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/flowmail

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest config files directly from GitHub (replaces scp)
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml" -o docker-compose.prod.yml
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/nginx/flowmail.conf" -o nginx/flowmail.conf

            # Write IMAGE_TAG and GITHUB_REPOSITORY to .deploy.env so docker compose can read them
            # (shell export alone is not reliable for docker compose variable substitution)
            REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "IMAGE_TAG=${{ github.sha }}" > .deploy.env
            echo "GITHUB_REPOSITORY=${REPO_LC}" >> .deploy.env
            cat .deploy.env

            # Pull latest images using explicit env file so IMAGE_TAG is resolved correctly
            docker compose --env-file .deploy.env -f docker-compose.prod.yml pull web docs migrate

            # Verify we pulled the right image digest
            echo "=== web image pulled: ghcr.io/${REPO_LC}:${{ github.sha }} ==="
            docker inspect "ghcr.io/${REPO_LC}:${{ github.sha }}" --format '{{.Id}}' 2>/dev/null || echo "⚠️ Image not found locally after pull — check GHCR permissions"

            # Run database migrations from pre-built image
            docker compose --env-file .deploy.env -f docker-compose.prod.yml --profile migrate run --rm migrate

            # Force recreate all containers so they pick up latest .env and images
            docker compose --env-file .deploy.env -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # Restart nginx so it re-resolves upstream IPs after container recreate
            docker compose --env-file .deploy.env -f docker-compose.prod.yml restart nginx

            # Cleanup old images aggressively — dangling + any unused tag older than 72h
            # 只 prune -f 只清 dangling，长期累积下旧 SHA tag 镜像会撑爆磁盘（曾导致 PG OOM/502）
            docker image prune -af --filter "until=72h" || true
            docker builder prune -af --filter "until=168h" || true

            # Health check with retry — use container IP since port is not published to host
            for i in 1 2 3 4 5 6; do
              sleep 10
              WEB_IP=$(docker inspect flowmail-web --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
              if [ -n "$WEB_IP" ] && curl -sf http://$WEB_IP:3000/api/health > /dev/null 2>&1; then
                echo "✅ Web health check passed (IP: $WEB_IP)"
                break
              fi
              echo "⏳ Web not ready yet (attempt $i/6)..."
            done
            WEB_IP=$(docker inspect flowmail-web --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            curl -sf http://$WEB_IP:3000/api/health || echo "⚠️ Web health check failed after 60s"
            DOCS_IP=$(docker inspect flowmail-docs --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            curl -sf http://$DOCS_IP:3001 || echo "⚠️ Docs health check failed"
