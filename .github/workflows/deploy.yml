name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            port: "3000"
            image_suffix: ""
            dockerfile: Dockerfile
          - app: docs
            port: "3001"
            image_suffix: "-docs"
            dockerfile: Dockerfile
          - app: migrate
            port: "0"
            image_suffix: "-migrate"
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            PORT=${{ matrix.port }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lighthouse
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/flowmail

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set image tag (repository must be lowercase for Docker)
            export IMAGE_TAG=${{ github.sha }}
            export GITHUB_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Pull latest config files directly from GitHub (replaces scp)
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml" -o docker-compose.prod.yml
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/nginx/flowmail.conf" -o nginx/flowmail.conf

            # Pull latest images (including migrate image)
            docker compose -f docker-compose.prod.yml pull web docs migrate

            # Run database migrations from pre-built image
            docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate

            # Rolling restart (without migrate profile)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Restart nginx so it re-resolves upstream IPs after container recreate
            docker compose -f docker-compose.prod.yml restart nginx

            # Cleanup old images
            docker image prune -f

            # Health check with retry (web container may need startup time)
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ Web health check passed"
                break
              fi
              echo "⏳ Web not ready yet (attempt $i/6)..."
            done
            curl -sf http://localhost:3000/api/health || echo "⚠️ Web health check failed after 60s"
            curl -sf http://localhost:3001 || echo "⚠️ Docs health check failed"
