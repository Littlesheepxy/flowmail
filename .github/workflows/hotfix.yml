name: Hotfix — Run command on server

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to run on server'
        required: true
        default: 'echo hello'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Execute on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: ${{ github.event.inputs.command }}
