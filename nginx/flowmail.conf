upstream web_upstream {
    server web:3000;
}

upstream docs_upstream {
    server docs:3001;
}

# ── Redirect HTTP → HTTPS ──
server {
    listen 80;
    server_name flowmail.work docs.flowmail.work;
    return 301 https://$host$request_uri;
}

# ── Main app: flowmail.work ──
server {
    listen 443 ssl;
    http2 on;
    server_name flowmail.work;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (HSTS handled by Cloudflare)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # SSE support for MCP Server & streaming
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://web_upstream;
    }

    # MCP / SSE endpoints need long timeouts
    location /mcp/ {
        proxy_pass http://web_upstream;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API routes
    location /api/ {
        proxy_pass http://web_upstream;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://web_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Docs: docs.flowmail.work ──
server {
    listen 443 ssl;
    http2 on;
    server_name docs.flowmail.work;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://docs_upstream;
    }

    location /_next/static/ {
        proxy_pass http://docs_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
